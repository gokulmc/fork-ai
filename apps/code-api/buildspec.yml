version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-south-1
    IMAGE_REPO_NAME: forkai-code-api
    EB_APP_NAME: forkai-code-api
    EB_ENV_NAME: forkai-code-api-prod
    S3_BUCKET: forkai-eb-artifacts
    # Same repo/commit SHAs as apps/api's build — prefix the S3 key so the two
    # buildspecs' app-bundle.zip uploads never collide on IMAGE_TAG.
    S3_PREFIX: code-api
  secrets-manager:
    ANTHROPIC_API_KEY: forkai/anthropic-api-key
    GEMINI_API_KEY: forkai/gemini-api-key
    DEEPSEEK_API_KEY: forkai/deepseek-api-key
    GLM_API_KEY: forkai/glm-api-key
    GITHUB_CLIENT_SECRET: forkai/github-code-client-secret
    GITHUB_APP_PRIVATE_KEY_B64: forkai/github-app-private-key-b64
    FLY_API_TOKEN: forkai/fly-api-token

phases:
  pre_build:
    commands:
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_REPO=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO
      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION
  build:
    commands:
      - docker build -f apps/code-api/Dockerfile -t $ECR_REPO:$IMAGE_TAG -t $ECR_REPO:latest .
  post_build:
    commands:
      - docker push $ECR_REPO:$IMAGE_TAG
      - docker push $ECR_REPO:latest
      - printf '{"AWSEBDockerrunVersion":"1","Image":{"Name":"%s","Update":"true"},"Ports":[{"ContainerPort":8080}]}' $ECR_REPO:$IMAGE_TAG > Dockerrun.aws.json
      # Bundle Dockerrun + .platform hooks (nginx proxy timeouts) into a zip. A bare
      # Dockerrun.aws.json source bundle silently ignores .platform; a zip applies it.
      - cp -r apps/code-api/.platform .platform
      - zip -r app-bundle.zip Dockerrun.aws.json .platform
      - aws s3 cp app-bundle.zip s3://$S3_BUCKET/$S3_PREFIX/$IMAGE_TAG/app-bundle.zip
      # Create EB application version (no-op if this commit was already registered)
      - aws elasticbeanstalk create-application-version --application-name $EB_APP_NAME --version-label $IMAGE_TAG --source-bundle S3Bucket=$S3_BUCKET,S3Key=$S3_PREFIX/$IMAGE_TAG/app-bundle.zip --region $AWS_DEFAULT_REGION || true
      # Deploy new version and inject secrets in one call to avoid
      # OperationInProgress conflict. Values containing + (base64 PEM keys) or
      # \, (comma-separated lists) break AWS CLI v1's shorthand --option-settings
      # parser — write JSON to a temp file and use --cli-input-json instead (see
      # root CLAUDE.md's "AWS CLI v1 — known quirks").${'\n'}      - printf '{"EnvironmentName":"%s","OptionSettings":[{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"ANTHROPIC_API_KEY","Value":"%s"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"GEMINI_API_KEY","Value":"%s"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"DEEPSEEK_API_KEY","Value":"%s"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"GLM_API_KEY","Value":"%s"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"GITHUB_CLIENT_SECRET","Value":"%s"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"FLY_API_TOKEN","Value":"%s"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"AGENT_RUNNER","Value":"cloud"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"FLY_ORG","Value":"personal"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"FLY_SANDBOX_IMAGE","Value":"registry.fly.io/forkai-sbx-base:latest"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"FLY_REGION","Value":"sin"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"FLY_REGIONS","Value":"sin,bom"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"SANDBOX_TTL_MINUTES","Value":"10"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"GITHUB_APP_ID","Value":"4286370"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"GITHUB_APP_SLUG","Value":"forkai-code"},{"Namespace":"aws:elasticbeanstalk:application:environment","OptionName":"GITHUB_APP_PRIVATE_KEY_B64","Value":"%s"}]}\n' "$EB_ENV_NAME" "$ANTHROPIC_API_KEY" "$GEMINI_API_KEY" "$DEEPSEEK_API_KEY" "$GLM_API_KEY" "$GITHUB_CLIENT_SECRET" "$FLY_API_TOKEN" "$GITHUB_APP_PRIVATE_KEY_B64" > /tmp/eb-update.json && aws elasticbeanstalk update-environment --application-name $EB_APP_NAME --region $AWS_DEFAULT_REGION --version-label $IMAGE_TAG --cli-input-json file:///tmp/eb-update.json

artifacts:
  files:
    - Dockerrun.aws.json
